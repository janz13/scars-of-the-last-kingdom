name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Generate Story Metadata
        run: pnpm run generate:metadata

      - name: Run Typecheck
        run: pnpm run typecheck

      - name: Run Engine Tests
        run: pnpm test

      - name: Run E2E Tests (Tiers 1-4)
        run: pnpm run test:e2e

      - name: Run Game Graph Audit
        run: pnpm --filter @workspace/scripts run audit

      - name: Determine Expo Base URL
        id: expo-base-url
        run: |
          REPO_NAME="${{ github.event.repository.name }}"
          # If repository is named <owner>.github.io, GitHub Pages serves from root /
          if [[ "$REPO_NAME" =~ \.github\.io$ ]]; then
            echo "base_url=" >> $GITHUB_OUTPUT
          else
            echo "base_url=/$REPO_NAME" >> $GITHUB_OUTPUT
          fi

      - name: Build web export
        working-directory: artifacts/mobile
        run: pnpm run build:web
        env:
          EXPO_BASE_URL: ${{ vars.EXPO_BASE_URL || steps.expo-base-url.outputs.base_url }}
          EXPO_ROUTER_APP_ROOT: ./app

      - name: Verify Bundle Size & Code Splitting
        run: pnpm run check-bundle

      - name: Ensure .nojekyll exists
        run: touch artifacts/mobile/dist/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: 'artifacts/mobile/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 600000

      - name: Post-Deploy Live URL & SW Cache Smoke Check
        shell: bash
        run: |
          BASE_URL="${{ steps.deployment.outputs.page_url }}"
          SHORT_SHA="${GITHUB_SHA:0:7}"
          for i in $(seq 1 6); do
            if curl -fsSL "${BASE_URL}" > /dev/null && curl -fsSL "${BASE_URL}sw.js?t=$(date +%s)" | grep -q "sotlk-${SHORT_SHA}"; then
              echo "✅ Live deployment verified at ${BASE_URL} with CACHE_VERSION=sotlk-${SHORT_SHA}"
              exit 0
            fi
            echo "⏳ Waiting for CDN propagation (${i}/6)..."
            sleep 5
          done
          echo "⚠️ Timed out waiting for SW stamp propagation; checking base HTML status:"
          curl -fsSLI "${BASE_URL}"
