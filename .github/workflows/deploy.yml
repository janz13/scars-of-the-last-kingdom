name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Determine Expo Base URL
        id: expo-base-url
        run: |
          REPO_NAME="${{ github.event.repository.name }}"
          # If repository is named <owner>.github.io, GitHub Pages serves from root /
          if [[ "$REPO_NAME" =~ \.github\.io$ ]]; then
            echo "base_url=" >> $GITHUB_OUTPUT
          else
            echo "base_url=/$REPO_NAME" >> $GITHUB_OUTPUT
          fi

      - name: Build web export
        working-directory: artifacts/mobile
        run: pnpm run build:web
        env:
          EXPO_BASE_URL: ${{ vars.EXPO_BASE_URL || steps.expo-base-url.outputs.base_url }}
          EXPO_ROUTER_APP_ROOT: ./app

      - name: Ensure .nojekyll exists
        run: touch artifacts/mobile/dist/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'artifacts/mobile/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
